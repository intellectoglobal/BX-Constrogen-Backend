name: Build IQ CI/CD

on:
  push:
    branches: 
      - main
      - development

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      id: docker_build
      with:
        context: .
        file: ${{ github.ref_name == 'main' && 'Dockerfile' || 'Dockerfile.dev' }}
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ steps.meta.outputs.tags }}
        cache-to: type=inline

  deploy:
    name: Pull and Deploy Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Set up SSH for EC2
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Add EC2 host to known_hosts
      run: |
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy Docker Image to EC2
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Deploying to production..."

            docker stop erp_api || true && docker rm erp_api || true

            docker rmi ${{ secrets.PROD_DOCKER_IMAGE }} || true

            docker pull ${{ secrets.PROD_DOCKER_IMAGE }}

            docker run -d \
              --name erp_api \
              -p 8000:8000 \
              -e ENVIRONMENT="prod" \
              -e POSTGRES_HOST="${{ secrets.EC2_HOST }}" \
              -e POSTGRES_USER="${{ secrets.POSTGRES_PROD_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PROD_PASSWORD }}" \
              -e POSTGRES_DB="${{ secrets.POSTGRES_PROD_DB }}" \
              -e POSTGRES_PORT="${{ secrets.POSTGRES_PROD_PORT }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e JWT_SIGNING_KEY="${{ secrets.JWT_SIGNING_KEY }}" \
              -e OTP_SECRET="${{ secrets.OTP_SECRET }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e VECTOR_DB_HOST="${{ secrets.VECTOR_DB_HOST }}" \
              -e VECTOR_DB_PORT="${{ secrets.VECTOR_DB_PORT }}" \
              -e SMTP_SERVER="${{ secrets.SMTP_SERVER }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}" \
              -e SENDER_PASSWORD="${{ secrets.SENDER_PASSWORD }}" \
              -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
              -e REDIS_USER="${{ secrets.REDIS_USER }}" \
              -e REDIS_PWD="${{ secrets.REDIS_PWD }}" \
              ${{ secrets.PROD_DOCKER_IMAGE }}
          else
            echo "Deploying to development..."

            docker stop erp_api_dev || true && docker rm erp_api_dev || true

            docker rmi ${{ secrets.DEV_DOCKER_IMAGE }} || true

            docker pull ${{ secrets.DEV_DOCKER_IMAGE }}

            docker run -d \
              --name erp_api_dev \
              -p 8080:8080 \
              -e ENVIRONMENT="dev" \
              -e POSTGRES_HOST="${{ secrets.EC2_HOST }}" \
              -e POSTGRES_USER="${{ secrets.POSTGRES_DEV_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_DEV_PASSWORD }}" \
              -e POSTGRES_DB="${{ secrets.POSTGRES_DEV_DB }}" \
              -e POSTGRES_PORT="${{ secrets.POSTGRES_DEV_PORT }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e JWT_SIGNING_KEY="${{ secrets.JWT_SIGNING_KEY }}" \
              -e OTP_SECRET="${{ secrets.OTP_SECRET }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
              -e S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e VECTOR_DB_HOST="${{ secrets.VECTOR_DB_HOST }}" \
              -e VECTOR_DB_PORT="${{ secrets.VECTOR_DB_PORT }}" \
              -e SMTP_SERVER="${{ secrets.SMTP_SERVER }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}" \
              -e SENDER_PASSWORD="${{ secrets.SENDER_PASSWORD }}" \
              -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
              -e REDIS_USER="${{ secrets.REDIS_USER }}" \
              -e REDIS_PWD="${{ secrets.REDIS_PWD }}" \
              ${{ secrets.DEV_DOCKER_IMAGE }}
          fi
        EOF
